<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
  <style>
    /* Centraliza e estiliza o fundo */
    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Caixa do formulário com bordas arredondadas */
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    div {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    /* Inputs com bordas arredondadas */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    /* Efeito ao focar (:focus) */
    input:focus, select:focus, textarea:focus {
      border-color: #007BFF;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    textarea {
      resize: vertical;
      height: 60px;
    }

    /* Botão */
    button {
      background-color: #007BFF;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form>
    <h2>Formulário</h2>

    <div>
      <label>Nome:</label>
      <input type="text" required>
    </div>

    <div>
      <label>E-mail:</label>
      <input type="email" required>
    </div>

    <div>
      <label>Senha:</label>
      <input type="password" required>
    </div>

    <div>
      <label>Data de nascimento:</label>
      <input type="date" required>
    </div>

    <div>
      <label>Curso:</label>
      <select required>
        <option value="">Selecione...</option>
        <option>Informática</option>
        <option>Administração</option>
      </select>
    </div>

    <div>
      <label>Sexo:</label>
      <input type="radio" name="sexo"> Masculino
      <input type="radio" name="sexo"> Feminino
    </div>

    <div>
      <label>Interesses:</label>
      <input type="checkbox"> Programação
      <input type="checkbox"> Design
    </div>

    <div>
      <label>Comentários:</label>
      <textarea></textarea>
    </div>

    <div>
      <label>Upload de foto:</label>
      <input type="file">
    </div>

    <button type="submit">Enviar</button>
  </form>

</body>
</html>
